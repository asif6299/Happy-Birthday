<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Happy Birthday</title>
<link href="https://fonts.googleapis.com/css2?family=Bagel+Fat+One&family=Nunito:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg1:#2a1245; --bg2:#5a1f66; --ink:#fff4fb; --muted:#e3c9f0;
  --gold:#ffc94d; --rose:#ff5d8f; --mint:#5de0c0; --sky:#6fa8ff; --plate:#3a1858;
  --cake1:#ff8fb1; --cake2:#ffd9e6; --cake3:#8a4dd8;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
:root:not([data-theme="dark"]){}
@media (prefers-color-scheme: light){
  :root:not([data-theme="dark"]){ --bg1:#ffe3ef; --bg2:#d9c8ff; --ink:#3a1252; --muted:#6b3f8a; --plate:#fff; }
}
:root[data-theme="dark"]{ --bg1:#2a1245; --bg2:#5a1f66; --ink:#fff4fb; --muted:#e3c9f0; --plate:#3a1858; }
*,*::before,*::after{box-sizing:border-box}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
body{
  margin:0; min-height:100%; overflow-x:hidden; color:var(--ink);
  font-family:"Nunito",system-ui,sans-serif;
  background:radial-gradient(ellipse at 50% 120%,var(--bg2),var(--bg1) 70%) fixed;
  display:flex; flex-direction:column; align-items:center; text-align:center;
}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg1)}

/* stars */
.stars{position:fixed;inset:0;pointer-events:none}
.stars i{position:absolute;width:3px;height:3px;border-radius:50%;background:var(--gold);opacity:.7;animation:twinkle 3s ease-in-out infinite}
@keyframes twinkle{0%,100%{opacity:.15;transform:scale(.6)}50%{opacity:.9;transform:scale(1.3)}}

/* balloons */
.balloons{position:fixed;inset:0;pointer-events:none;overflow:hidden}
.balloon{
  position:absolute;bottom:-160px;width:56px;height:70px;border-radius:50% 50% 48% 48%;
  background:radial-gradient(circle at 35% 30%,rgba(255,255,255,.55),transparent 35%),var(--c);
  animation:rise var(--t) linear infinite; animation-delay:var(--d); left:var(--x);
}
.balloon::after{content:"";position:absolute;left:50%;top:100%;width:1.5px;height:70px;background:var(--muted);opacity:.6;transform-origin:top;animation:sway 3s ease-in-out infinite alternate}
@keyframes rise{from{transform:translateY(0) rotate(-4deg)}50%{transform:translateY(-60vh) translateX(18px) rotate(4deg)}to{transform:translateY(-130vh) translateX(-12px) rotate(-4deg)}}
@keyframes sway{from{transform:rotate(-6deg)}to{transform:rotate(6deg)}}

main{position:relative;z-index:2;width:min(100%,640px);padding:48px 20px 56px}

h1{
  margin:0;font-family:"Bagel Fat One","Trebuchet MS",sans-serif;font-weight:400;
  font-size:clamp(2.6rem,11vw,5rem);line-height:1;letter-spacing:.01em;
}
h1 span{display:inline-block;animation:bounce 2.4s ease-in-out infinite;animation-delay:calc(var(--i)*.09s)}
h1 span:nth-child(3n){color:var(--gold)} h1 span:nth-child(3n+1){color:var(--rose)} h1 span:nth-child(3n+2){color:var(--mint)}
h1 .sp{width:.3em}
@keyframes bounce{0%,60%,100%{transform:translateY(0)}30%{transform:translateY(-.22em) rotate(-4deg)}}

.name{margin:14px 0 0;font-size:1.5rem;font-weight:700;color:var(--gold)}
.sub{margin:6px auto 0;max-width:34ch;color:var(--muted);line-height:1.6}

/* cake */
.stage{position:relative;margin:56px auto 0;width:260px;height:270px}
.plate{position:absolute;bottom:0;left:-20px;right:-20px;height:20px;border-radius:50%;background:var(--plate);box-shadow:0 10px 30px rgba(0,0,0,.35)}
.tier{position:absolute;left:50%;transform:translateX(-50%);border-radius:14px 14px 10px 10px}
.t1{bottom:10px;width:260px;height:80px;background:linear-gradient(var(--cake3),#6a35b0)}
.t2{bottom:90px;width:190px;height:70px;background:linear-gradient(var(--cake1),#ff6f9d)}
.t3{bottom:160px;width:120px;height:56px;background:linear-gradient(var(--cake2),#ffc3d8)}
.drip{position:absolute;top:0;left:0;right:0;height:22px;border-radius:14px 14px 0 0;background:#fff;
  -webkit-mask:radial-gradient(circle 9px at 12px 9px,#000 98%,transparent) 0 0/26px 100%,linear-gradient(#000 0 9px,transparent 9px);
  -webkit-mask-composite:source-over;mask:radial-gradient(circle 9px at 12px 9px,#000 98%,transparent) 0 0/26px 100%,linear-gradient(#000 0 9px,transparent 9px);opacity:.92}
.dots{position:absolute;inset:34px 0 10px;background:radial-gradient(circle,var(--gold) 3px,transparent 3.5px) 0 0/24px 20px;opacity:.85}

.candles{position:absolute;bottom:216px;left:50%;transform:translateX(-50%);display:flex;gap:22px}
.candle{position:relative;width:10px;height:44px;border-radius:3px;background:repeating-linear-gradient(135deg,#fff 0 6px,var(--sky) 6px 12px)}
.flame{
  position:absolute;left:50%;bottom:100%;width:14px;height:26px;margin-left:-7px;margin-bottom:4px;
  border-radius:50% 50% 50% 50%/60% 60% 40% 40%;transform-origin:50% 100%;
  background:radial-gradient(ellipse at 50% 75%,#fff7c2 0,var(--gold) 45%,#ff8a2b 100%);
  box-shadow:0 0 18px 6px rgba(255,201,77,.55);
  animation:flicker .5s ease-in-out infinite alternate;animation-delay:var(--fd);
  transition:opacity .4s,transform .4s;
}
@keyframes flicker{from{transform:scale(1,1) rotate(-3deg)}to{transform:scale(.88,1.12) rotate(3deg)}}
.out .flame{opacity:0;transform:scale(.2);animation:none}
.smoke{position:absolute;left:50%;bottom:100%;width:6px;height:6px;border-radius:50%;background:var(--muted);opacity:0}
.out .smoke{animation:smoke 1.6s ease-out forwards;animation-delay:var(--fd)}
@keyframes smoke{0%{opacity:.7;transform:translate(0,0) scale(1)}100%{opacity:0;transform:translate(8px,-60px) scale(4)}}

button{
  margin-top:40px;font:inherit;font-weight:700;font-size:1.05rem;color:#3a1252;
  background:linear-gradient(135deg,var(--gold),#ff9ec0);border:0;border-radius:999px;
  padding:14px 30px;cursor:pointer;box-shadow:0 8px 24px rgba(255,93,143,.4);
  transition:transform .2s,box-shadow .2s;
}
button:hover{transform:translateY(-2px) scale(1.03)}
button:active{transform:scale(.97)}
button:focus-visible{outline:3px solid var(--mint);outline-offset:4px}

.wish{
  margin:34px auto 0;max-width:36ch;padding:22px 24px;border-radius:22px;line-height:1.7;
  background:rgba(255,255,255,.1);border:1.5px solid rgba(255,201,77,.5);
  opacity:0;transform:translateY(16px) scale(.96);pointer-events:none;
  transition:opacity .6s .5s,transform .6s .5s;
}
.out ~ .wish, .wish.show{opacity:1;transform:none}

/* confetti */
.confetti{position:fixed;inset:0;pointer-events:none;z-index:5;overflow:hidden}
.confetti b{
  position:absolute;top:-20px;left:var(--x);width:var(--w);height:calc(var(--w)*1.6);background:var(--c);
  border-radius:2px;animation:fall var(--t) cubic-bezier(.3,.6,.5,1) forwards;
}
@keyframes fall{
  0%{transform:translate3d(0,0,0) rotate(0)}
  100%{transform:translate3d(var(--dx),110vh,0) rotate(var(--r))}
}

@media (prefers-reduced-motion: reduce){
  *,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}
  .balloons{display:none}
}
</style>
</head>
<body>
<div class="stars" id="stars" aria-hidden="true"></div>
<div class="balloons" aria-hidden="true">
  <div class="balloon" style="--c:#ff5d8f;--x:6%;--t:16s;--d:0s"></div>
  <div class="balloon" style="--c:#5de0c0;--x:22%;--t:20s;--d:-6s"></div>
  <div class="balloon" style="--c:#ffc94d;--x:74%;--t:18s;--d:-3s"></div>
  <div class="balloon" style="--c:#6fa8ff;--x:88%;--t:22s;--d:-10s"></div>
</div>
<div class="confetti" id="confetti" aria-hidden="true"></div>

<main>
  <h1 id="title" aria-label="Happy Birthday"></h1>
  <p class="name">Alex</p>
  <p class="sub">Another trip around the sun. Make a wish, then blow out the candles.</p>

  <div class="stage" id="stage">
    <div class="candles">
      <div class="candle"><i class="flame" style="--fd:0s"></i><i class="smoke" style="--fd:0s"></i></div>
      <div class="candle"><i class="flame" style="--fd:.15s"></i><i class="smoke" style="--fd:.15s"></i></div>
      <div class="candle"><i class="flame" style="--fd:.3s"></i><i class="smoke" style="--fd:.3s"></i></div>
    </div>
    <div class="tier t3"><div class="drip"></div></div>
    <div class="tier t2"><div class="drip"></div><div class="dots"></div></div>
    <div class="tier t1"><div class="drip"></div><div class="dots"></div></div>
    <div class="plate"></div>
  </div>

  <button id="blow" type="button">Blow out the candles</button>
  <p class="wish" id="wish">Wishing you a year of good surprises, long laughs and cake whenever you want it. Happy birthday!</p>
</main>

<script>
(function(){
  // Animated title, one letter at a time
  var t=document.getElementById('title'), words=['Happy','Birthday'], i=0, html='';
  words.forEach(function(w,wi){
    w.split('').forEach(function(ch){html+='<span style="--i:'+(i++)+'" aria-hidden="true">'+ch+'</span>'});
    if(wi===0){html+='<span class="sp"> </span><br>'}
  });
  t.innerHTML=html;

  // Twinkling stars
  var s=document.getElementById('stars'), sh='';
  for(var k=0;k<40;k++){sh+='<i style="left:'+Math.random()*100+'%;top:'+Math.random()*100+'%;animation-delay:'+(Math.random()*3).toFixed(2)+'s"></i>'}
  s.innerHTML=sh;

  // Confetti
  var box=document.getElementById('confetti'), colors=['#ff5d8f','#ffc94d','#5de0c0','#6fa8ff','#b58bff','#ffffff'];
  function burst(n){
    var h='';
    for(var k=0;k<n;k++){
      h+='<b style="--x:'+(Math.random()*100)+'%;--w:'+(6+Math.random()*8).toFixed(1)+'px;--c:'+colors[k%colors.length]+
         ';--t:'+(2.4+Math.random()*2.2).toFixed(2)+'s;--dx:'+((Math.random()-.5)*240).toFixed(0)+'px;--r:'+((Math.random()-.5)*1440).toFixed(0)+'deg"></b>';
    }
    box.insertAdjacentHTML('beforeend',h);
    setTimeout(function(){box.innerHTML=''},5200);
  }

  var stage=document.getElementById('stage'), btn=document.getElementById('blow'), wish=document.getElementById('wish');
  btn.addEventListener('click',function(){
    var out=stage.classList.toggle('out');
    wish.classList.toggle('show',out);
    btn.textContent=out?'Light them again':'Blow out the candles';
    if(out){burst(90)}
  });
  setTimeout(function(){burst(50)},700); // welcome burst
})();
</script>
</body>
</html>
